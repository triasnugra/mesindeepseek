name: Deploy Crypto Analyzer to GitHub Pages

on:
  push:
    branches: ["main"] # Ganti jika branch utama Anda "master"
  schedule:
    # Berjalan setiap jam (menit ke-0). Catatan: GitHub Actions menggunakan UTC.
    - cron: '0 * * * *'
  workflow_dispatch: # Memungkinkan Anda menjalankan manual dari tab Actions

# Atur permissions untuk GITHUB_TOKEN agar bisa deploy ke Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Hanya izinkan satu deployment bersamaan
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip' # Caching dependencies agar lebih cepat

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Analysis Engine
        run: python main.py

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload folder 'docs' yang berisi index.html
          path: './docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
