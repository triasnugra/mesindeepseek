name: Deploy Crypto Analyzer to Github Pages

on:
  push:
    branches:
      - main # Sesuaikan dengan nama branch utama Anda (main/master)
  schedule:
    - cron: '0 */4 * * *' # Opsional: Menjalankan bot setiap 4 jam secara otomatis
  workflow_dispatch: # Mengizinkan Anda menekan tombol "Run workflow" secara manual

# Izin ini wajib ada agar GitHub Actions bisa mempublikasikan ke GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Mencegah penumpukan deployment jika ada beberapa proses yang berjalan bersamaan
concurrency:
  group: "pages"
  cancel-in-progress: false
