name: Deploy Crypto Analyzer

on:
  push:
    branches: ["main"]
  schedule:
    - cron: '0 * * * *' # Jalan tiap jam
  workflow_dispatch: # Bisa dijalankan manual

permissions:
  contents: read
  pages: write
  id-token: write

# --- INI BAGIAN YANG DIPERBAIKI ---
concurrency:
  group: "pages"
  cancel-in-progress: false # Ubah ke false agar tidak membatalkan deploy yang sedang jalan

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Analysis Engine
        run: python main.py

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
